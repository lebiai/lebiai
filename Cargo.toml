[workspace]
resolver = "2"
members = [
    "crates/hermes-core",
    "crates/hermes-channel",
    "crates/hermes-llm",
    "crates/hermes-mcp",
    "crates/hermes-store",
    "crates/hermes-reflect",
    "crates/hermes-cli",
    "crates/hermes-gui", "crates/hermes-skills", "crates/hermes-memory", "crates/hermes-tools",
    "crates/hermes-turn",
    "crates/hermes-weixin",
    "crates/hermes-feishu",
    "crates/hermes-telegram",
    "crates/hermes-server",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.78"
authors = ["老码小张 <1595819400@qq.com>"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"

# Errors / logging
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Time / IDs
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Filesystem helpers
walkdir = "2"
gray_matter = "0.3"
dirs = "5"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# MCP
rmcp = { version = "1.6", default-features = false, features = ["client", "macros", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }

# Embeddings (feature-gated at crate level)
fastembed = "5"

# Internal
hermes-core = { path = "crates/hermes-core" }
hermes-channel = { path = "crates/hermes-channel" }
hermes-llm = { path = "crates/hermes-llm" }
hermes-mcp = { path = "crates/hermes-mcp" }
hermes-store = { path = "crates/hermes-store" }
hermes-skills = { path = "crates/hermes-skills" }
hermes-memory = { path = "crates/hermes-memory" }
hermes-tools = { path = "crates/hermes-tools" }
hermes-reflect = { path = "crates/hermes-reflect" }
hermes-turn = { path = "crates/hermes-turn" }
hermes-weixin = { path = "crates/hermes-weixin" }
hermes-feishu = { path = "crates/hermes-feishu" }
hermes-telegram = { path = "crates/hermes-telegram" }
hermes-server = { path = "crates/hermes-server" }

# HTTP/WebSocket server (hermes-server)
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
toml_edit = "0.22"
rand = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
