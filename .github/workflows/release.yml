name: Release Installers

# Build distributable desktop installers:
#   macOS  → .dmg   (scripts/build-dmg.sh)
#   Windows → NSIS .exe installer (scripts/build-exe.ps1)
#
# Trigger: push a tag `v*` or run manually (Actions → Release Installers →
# Run workflow). Artifacts are unsigned — codesigning/notarization is a
# distribution follow-up, documented in docs/guide/install.md.
#
# Required Actions secrets for updater artifacts (see docs/dev/updater-signing.md):
#   TAURI_SIGNING_PRIVATE_KEY
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach installers to"
        required: false
        default: "v1.2.0"
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  macos-dmg:
    name: macOS DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: Swatinem/rust-cache@v2

      - name: Install tauri-cli
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build DMG
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: scripts/build-dmg.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: lebi-ai-macos-dmg
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  windows-nsis:
    name: Windows EXE (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: Swatinem/rust-cache@v2

      - name: Install tauri-cli
        run: cargo install tauri-cli --version '^2' --locked

      - name: Prepare markitdown sidecar (self-contained Python)
        shell: pwsh
        run: .\scripts\prepare-markitdown-bundle.ps1

      - name: Build NSIS installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: .\scripts\build-exe.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: lebi-ai-windows-nsis
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

  publish:
    name: Publish installers to GitHub Release
    needs: [macos-dmg, windows-nsis]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lebi-ai-macos-dmg
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: lebi-ai-windows-nsis
          path: dist
      - name: Write latest.json
        run: |
          TAG="${{ github.event_name == 'push' && github.ref_name || inputs.tag }}"
          scripts/write-latest-json.sh "$TAG" dist dist/latest.json
      # action-gh-release 的 update 路径不会补正文，overwrite 入参也已废弃（被忽略）。
      # 先删旧 Release 再全新创建，保证 body_path 每次注入最新发布说明。
      - name: Clear stale release
        run: gh release delete "$RELEASE_TAG" --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          body_path: docs/releases/release-notes.md
          files: dist/**/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
